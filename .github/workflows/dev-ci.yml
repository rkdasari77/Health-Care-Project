name: Dev CI - Build & Push Docker Images

on:
  push:
    branches:
      - dev

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # =========================
      # FRONTEND SERVICE
      # =========================
      - name: Build Frontend Image
        run: |
          docker build \
            -t rkdasari0318/health-care-project/frontend-service:latest \
            -t rkdasari0318/health-care-project/frontend-service:${{ github.sha }} \
            1frontend

      - name: Push Frontend Image
        run: |
          docker push rkdasari0318/health-care-project/frontend-service:latest
          docker push rkdasari0318/health-care-project/frontend-service:${{ github.sha }}

      # =========================
      # ENQUIRY SERVICE
      # =========================
      - name: Build Enquiry Image
        run: |
          docker build \
            -t rkdasari0318/health-care-project/enquiry-service:latest \
            -t rkdasari0318/health-care-project/enquiry-service:${{ github.sha }} \
            2enquiry-service

      - name: Push Enquiry Image
        run: |
          docker push rkdasari0318/health-care-project/enquiry-service:latest
          docker push rkdasari0318/health-care-project/enquiry-service:${{ github.sha }}
